<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Sudoku Zen — calm, offline Sudoku. No ads. No tracking. Nothing leaves your phone.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="referrer" content="no-referrer">
<title>Sudoku Zen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/boot.js"></script>
</head>
<body>
<main id="view" class="view"></main>

<nav id="tabbar" aria-label="Main">

    <span>Home</span></button>
  <button data-tab="stats" class="tab">

    <span>Settings</span></button>
</nav>

<script type="module" src="js/app.js"></script>

</html>
